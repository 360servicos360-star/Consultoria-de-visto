<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Visto CPLP & Portugal - Assessoria</title>
    <style>
        :root {
            --primary: #0066cc;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --bg: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .question {
            margin-bottom: 18px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            font-size: 14px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: #252525;
            text-align: center;
        }

        .score-bar {
            height: 20px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .score-fill {
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
            text-decoration: none;
            display: block;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            font-size: 15px;
        }

        .missing-list {
            text-align: left;
            font-size: 14px;
            color: #ffcc00;
            margin: 10px 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Simulador de Visto CPLP</h2>
    <p class="subtitle">Descubra se o seu processo está pronto para aplicação em Portugal</p>

    <form id="quizForm">
        <div class="question">
            <label>1. O seu passaporte tem validade superior a 6 meses?</label>
            <select id="q1" required>
                <option value="">Selecione...</option>
                <option value="15">Sim, tem mais de 6 meses</option>
                <option value="0">Não / Está caducado</option>
            </select>
        </div>

        <div class="question">
            <label>2
